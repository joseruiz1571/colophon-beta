id: 8f3a2c1d-4b5e-4a67-9c8d-1e2f3a4b5c6d
name: evidence-reader
owner: grc@acme.example
risk_tier: high
autonomy_level: supervised
next_review: "2027-12-31"
description: >
  High-risk read-only evidence agent. Collects branch-protection settings
  from in-scope repositories. May not write, expand credentials, or send mail.
tools:
  - name: fs.read
    data_access: read
    data_classes: [filesystem]
    requires_approval: false
  - name: repo.list
    data_access: read
    data_classes: [repository]
    requires_approval: false
  - name: repo.read_settings
    data_access: read
    data_classes: [repository]
    requires_approval: false
  - name: net.fetch
    data_access: read
    data_classes: [network]
    requires_approval: false
sandbox:
  write_paths: []
decision_boundaries:
  - id: in-scope-repos
    description: Only acme-corp application repositories listed here may be read.
    allowed_repositories:
      - acme-corp/web
      - acme-corp/api
  - id: in-scope-urls
    description: Network fetches are limited to synthetic .example status endpoints.
    allowed_url_prefixes:
      - https://status.github.example/
escalation:
  contact: security@acme.example
  kill_switch:
    available: true
    mechanism: Revoke this Agent Card and terminate the local gate process.
governance:
  control_mappings:
    - control_id: CTRL-NO-OUT-OF-CARD
      framework_ref: "NIST AI RMF GOVERN-1.2"
    - control_id: CTRL-NO-SCOPE-EXPANSION
      framework_ref: "OWASP LLM06"
    - control_id: CTRL-LEAST-AGENCY
      framework_ref: "ISO/IEC 42001:2023 6.1"
evidence:
  - kind: trace
    description: Hash-chained gate decisions for each tool call
  - kind: card
    description: The Agent Card in force for the session
